name: clips
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "transcribe: timecoded text · cut: clips from a plan"
        required: true
        default: transcribe
        type: choice
        options: [transcribe, cut]
      source:
        description: "audio path in repo, e.g. inputs/sample.mp3"
        required: true
        default: inputs/test.mp3
      plan:
        description: "plan JSON path (cut mode only)"
        required: false
        default: plans/test-plan.json
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Transcribe
        if: inputs.mode == 'transcribe'
        shell: bash
        run: |
          set -o pipefail
          python -u -c "import faster_whisper, sys; print('faster_whisper ok', sys.version)" 2>&1 | tee run.log
          python -u scripts/transcribe.py "${{ inputs.source }}" out 2>&1 | tee -a run.log
      - name: Cut clips
        if: inputs.mode == 'cut'
        shell: bash
        run: |
          set -o pipefail
          { command -v ffmpeg; command -v ffprobe; ls -la "${{ inputs.source }}" "${{ inputs.plan }}"; } 2>&1 | tee run.log || true
          python -u scripts/cut.py "${{ inputs.source }}" "${{ inputs.plan }}" out 2>&1 | tee -a run.log
      - name: Publish log to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch run.log
          gh api repos/${{ github.repository }}/git/refs -f ref=refs/heads/ci-logs -f sha=${{ github.sha }} >/dev/null 2>&1 || true
          gh api -X PUT repos/${{ github.repository }}/contents/logs/run-${{ github.run_id }}.txt -f message="log ${{ github.run_id }}" -f branch=ci-logs -f content="$(base64 -w0 run.log)" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ inputs.mode }}-${{ github.run_id }}
          path: out/
          retention-days: 7
